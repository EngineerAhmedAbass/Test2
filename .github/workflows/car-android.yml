name: Car Quran Radio APK

on:
  push:
    branches: ['main', 'ccr-8873d8cf-srncoj']
    paths: ['car/**', '.github/workflows/car-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: car-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p car/android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp car/android/app/build/outputs/apk/release/app-release.apk Quran-Radio-Car.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Quran-Radio-Car-apk
          path: Quran-Radio-Car.apk

      # رابط ثابت لآخر نسخة: releases/download/car-latest/Quran-Radio-Car.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete car-latest --yes --cleanup-tag || true
          gh release create car-latest Quran-Radio-Car.apk \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "قرآن وراديو للعربية (نسخة ${{ github.run_number }})" \
            --notes "نزّل Quran-Radio-Car.apk وسطّبه على الموبايل، وفعّل Unknown sources في إعدادات المطوّر بتاعة Android Auto."
