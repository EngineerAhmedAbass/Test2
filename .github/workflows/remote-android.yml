name: TV Remote APK

on:
  push:
    branches: ['main', 'ccr-7a8c4711-9jm88c']
    paths: ['remote/**', '.github/workflows/remote-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remote-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p remote/android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp remote/android/app/build/outputs/apk/release/app-release.apk TV-Remote.apk

      # التطبيق بيقرا الملف ده كل ما يتفتح عشان يعرف لو فيه نسخة أحدث
      - name: Version info
        run: |
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}", "apk": "https://github.com/${{ github.repository }}/releases/download/remote-latest/TV-Remote.apk"}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-apk
          path: TV-Remote.apk

      # رابط ثابت لآخر نسخة: releases/download/remote-latest/TV-Remote.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # امسح أي نسخة قديمة بنفس الـ tag (حتى لو اتسابت draft)
          for id in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.tag_name=="remote-latest") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" || true
          done
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/remote-latest" || true
          gh release create remote-latest TV-Remote.apk version.json \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "ريموت TV (نسخة ${{ github.run_number }})" \
            --notes "نزّل TV-Remote.apk وسطّبه على الموبايل، وخلي الموبايل والتليفزيون على نفس الواي فاي."
          # أحيانًا GitHub بيسيبها draft — ننشرها ونتأكد
          for i in 1 2 3 4 5; do
            gh release edit remote-latest --draft=false || true
            if curl -sfL -o /dev/null "https://github.com/${{ github.repository }}/releases/download/remote-latest/version.json"; then
              echo "published"; exit 0
            fi
            sleep 5
          done
          echo "release is not public"; exit 1
