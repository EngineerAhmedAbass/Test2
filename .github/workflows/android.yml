name: Android APK

on:
  push:
    branches: ['claude/iptv-account-program-7mgjz1', 'main']
    paths: ['public/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk STREAM-IPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: STREAM-IPTV-apk
          path: STREAM-IPTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: STREAM IPTV — نسخة ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: STREAM-IPTV.apk
          body: |
            نزّل ملف **STREAM-IPTV.apk** من تحت وسطّبه على الموبايل أو التليفزيون.
            لو الموبايل طلب، اسمح بتثبيت التطبيقات من مصادر غير معروفة.
