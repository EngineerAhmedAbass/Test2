name: Quran TV APK

on:
  push:
    branches: ['main', 'ccr-8873d8cf-srncoj']
    paths: ['tv/**', '.github/workflows/tv-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p tv/android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp tv/android/app/build/outputs/apk/release/app-release.apk Quran-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Quran-TV-apk
          path: Quran-TV.apk

      # رابط ثابت لآخر نسخة: releases/download/tv-latest/Quran-TV.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --yes --cleanup-tag || true
          gh release create tv-latest Quran-TV.apk \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "سورة البقرة للتليفزيون (نسخة ${{ github.run_number }})" \
            --notes "نزّل Quran-TV.apk وسطّبه على التليفزيون (Android TV / Google TV)."
