<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060606" />
  <title>STREAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ================= الدخول ================= -->
  <section id="login" class="login">
    <div class="login-card">
      <div class="logo big"><span class="tri"></span>STREAM</div>
      <p class="login-sub">شغّل اشتراك الـ IPTV بتاعك — قنوات، ماتشات، أفلام ومسلسلات</p>

      <div class="seg" role="tablist">
        <button class="seg-btn active" data-tab="xtream" type="button">Xtream Codes</button>
        <button class="seg-btn" data-tab="m3u" type="button">رابط M3U</button>
      </div>

      <form id="form-xtream" class="form">
        <label class="field"><span>عنوان السيرفر</span>
          <input name="server" placeholder="http://example.com:8080" required dir="ltr" autocomplete="url" inputmode="url" />
        </label>
        <label class="field"><span>اسم المستخدم</span>
          <input name="username" required dir="ltr" autocomplete="username" autocapitalize="off" />
        </label>
        <label class="field"><span>كلمة السر</span>
          <input name="password" type="password" required dir="ltr" autocomplete="current-password" />
        </label>
        <button type="submit" class="btn lime block">دخول</button>
      </form>

      <form id="form-m3u" class="form hidden">
        <label class="field"><span>رابط قائمة M3U</span>
          <input name="url" placeholder="http://example.com/get.php?username=...&password=...&type=m3u_plus" required dir="ltr" inputmode="url" />
        </label>
        <button type="submit" class="btn lime block">تحميل القائمة</button>
      </form>

      <label class="check"><input type="checkbox" id="remember" checked /><span class="box"></span>احفظ بياناتي على الجهاز ده</label>
      <p id="login-error" class="login-error" role="alert"></p>
    </div>
  </section>

  <!-- ================= التطبيق ================= -->
  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="logo"><span class="tri"></span>STREAM</div>
      <nav id="nav" class="nav"></nav>
      <div class="top-end">
        <span id="clock" class="clock"></span>
        <button id="account-btn" class="icon-btn" aria-label="حسابي" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </button>
      </div>
    </header>

    <!-- ---------- عرض القنوات المباشرة ---------- -->
    <main id="view-live" class="view live-view hidden">
      <aside class="channels panel">
        <div class="ch-head">
          <h2>القنوات</h2>
          <span id="ch-count" class="muted"></span>
        </div>
        <button id="cat-btn" class="cat-btn" type="button">
          <span id="cat-name">الكل</span>
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="search small">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="ch-search" placeholder="ابحث عن قناة..." aria-label="ابحث عن قناة" />
        </div>
        <div id="ch-list" class="vlist" tabindex="0" aria-label="لستة القنوات"></div>
      </aside>

      <section class="stage">
        <div id="live-slot" class="player-slot"></div>
        <div class="now-box">
          <div class="now-main">
            <div id="now-title" class="now-title">اختار قناة</div>
            <div id="now-sub" class="now-sub muted"></div>
            <div id="now-prog" class="prog hidden"><i></i></div>
          </div>
          <div class="now-next">
            <span class="muted">التالي</span>
            <b id="now-next">—</b>
          </div>
        </div>
        <div id="epg" class="epg panel"></div>
      </section>
    </main>

    <!-- ---------- عرض الشبكة (أفلام / مسلسلات / مكتبتي) ---------- -->
    <main id="view-grid" class="view grid-view hidden">
      <div class="grid-head">
        <div class="gh-title">
          <h1 id="grid-title"></h1>
          <span id="grid-count" class="muted"></span>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="grid-search" placeholder="ابحث..." aria-label="بحث" />
        </div>
      </div>
      <div class="chips-row">
        <button id="grid-cat-btn" class="chip strong" type="button">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
          الأقسام
        </button>
        <div id="chips" class="chips"></div>
      </div>
      <div id="grid" class="grid"></div>
      <div id="sentinel" class="sentinel"></div>
    </main>
  </section>

  <!-- ================= المشغل (الحاوية الأساسية للفيديو) ================= -->
  <div id="player-wrap" class="player">
    <video id="video" controls autoplay playsinline></video>
    <div class="p-top">
      <span id="p-live" class="pill-live">مباشر</span>
      <span id="p-name" class="p-name"></span>
      <span id="p-quality" class="p-quality"></span>
    </div>
    <div id="p-msg" class="p-msg hidden"><div class="spinner"></div><span></span></div>
    <div class="p-actions">
      <button id="prev-btn" class="icon-btn glass" type="button" aria-label="القناة اللي فاتت"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
      <button id="next-btn" class="icon-btn glass" type="button" aria-label="القناة الجاية"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <button id="fav-btn" class="icon-btn glass" type="button" aria-label="مفضلة"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
      <button id="copy-btn" class="icon-btn glass" type="button" aria-label="نسخ الرابط"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>
      <button id="fs-btn" class="icon-btn glass" type="button" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>

  <!-- ================= مشغل الأفلام (نافذة) ================= -->
  <div id="player-modal" class="modal player-modal hidden">
    <div class="pm-shell">
      <div class="pm-bar">
        <div>
          <div id="pm-title" class="pm-title"></div>
          <div id="pm-sub" class="muted"></div>
        </div>
        <button class="icon-btn" data-close type="button" aria-label="قفل"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="modal-slot" class="player-slot"></div>
    </div>
  </div>

  <!-- ================= الأقسام ================= -->
  <div id="cats-modal" class="modal hidden">
    <div class="sheet cats-sheet">
      <div class="sheet-head">
        <h3>الأقسام</h3>
        <button class="icon-btn" data-close type="button" aria-label="قفل"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="cat-search" placeholder="ابحث في الأقسام..." aria-label="ابحث في الأقسام" />
      </div>
      <div id="cat-grid" class="cat-grid"></div>
    </div>
  </div>

  <!-- ================= التفاصيل ================= -->
  <div id="details" class="modal hidden">
    <div class="sheet details-sheet">
      <button class="icon-btn floating" data-close type="button" aria-label="قفل"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div id="details-body"></div>
    </div>
  </div>

  <!-- ================= الحساب ================= -->
  <div id="account-modal" class="modal hidden">
    <div class="sheet account-sheet">
      <div class="sheet-head">
        <h3>حسابي</h3>
        <button class="icon-btn" data-close type="button" aria-label="قفل"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="account-body"></div>
      <button id="logout" class="btn block" type="button">تسجيل خروج</button>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="vendor/hls.min.js"></script>
  <script src="vendor/mpegts.js"></script>
  <script src="app.js"></script>
</body>
</html>
