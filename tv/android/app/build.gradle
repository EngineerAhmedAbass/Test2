plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tv.quran'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tv.quran'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // مفتاح ثابت عشان كل نسخة جديدة تتسطب فوق القديمة من غير ما تمسحها
        shared {
            storeFile file('tv.keystore')
            storePassword 'carquran'
            keyAlias 'car'
            keyPassword 'carquran'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-session:$media3"
    implementation "androidx.annotation:annotation:1.8.2"
}
