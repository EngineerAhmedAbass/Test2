plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvremote.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvremote.app'
        minSdk 23
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // مفتاح ثابت عشان كل نسخة جديدة تتسطب فوق القديمة من غير ما تمسحها
        shared {
            storeFile file('remote.keystore')
            storePassword 'tvremote'
            keyAlias 'remote'
            keyPassword 'tvremote'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    sourceSets {
        main {
            // الواجهة اللي في remote/public بتتحط جوه الـ APK
            assets.srcDirs = ['../../public']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
